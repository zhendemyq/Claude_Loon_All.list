# ============================================================
# 黄果短剧去广告 —— 描述文件合并片段 v4（Loon 3.5.x 双层方案）
# 适用：Loon 3.5.1(983)+（你的 3.53 满足）
# 思路：广告接口用 Rewrite 本地声明式改写（不依赖下载脚本，最稳）；
#       加密公告与开屏倒计时仍需 Script（载荷是 AES 密文，必须解密重加密）。
# ============================================================

[Rule]
# ============ 网页版 huangguoai.com（主战场）============
# 站点自建 SSP 会向第三方广告网络 api-ad3/4/5.adsdk*.cc 拉取广告，
# 一次 /api/sdk/ad/available 就返回 75KB 广告配置；直接封死这些域名，广告位拿不到素材就渲染不出来。
DOMAIN-KEYWORD,adsdk,REJECT
DOMAIN-SUFFIX,adsdk3.cc,REJECT
DOMAIN-SUFFIX,adsdk4.cc,REJECT
DOMAIN-SUFFIX,adsdk5.cc,REJECT
# 广告事件上报节点（广告曝光/点击统计，不影响正片播放）
DOMAIN,api-dc-prod-008.cyou,REJECT
DOMAIN,api-dc2-prod-08.cyou,REJECT
# ============ 旧 H5 SPA（备用线路）埋点 ============
URL-REGEX,^https?:\/\/[a-z0-9.-]+\/api\/track\/first-launch,REJECT-200
URL-REGEX,^https?:\/\/[a-z0-9.-]+\/api\/ad\/event,REJECT-200

[Rewrite]
# 【第一层·核心】广告位接口：直接把 data 换成空对象密文，
# 9 个广告位（开屏/海报/宫格/横幅）全部清空。纯本地规则，不依赖网络下载脚本。
response if ${url} ~= /\/api\/ad\/query/i && ${response.status} == 200 then response.json.replace("data", "jIY1j26vNjsdMuRZijJHvQ==")

[Script]
# 【第二层】加密公告/新客弹窗：载荷是 AES 密文，必须解密→清空→重加密，只能走脚本
response if ${url} ~= /^https?:\/\/[a-z0-9.-]+\/api\/(?:dispatch|app\/config)/i then script("https://raw.githubusercontent.com/zhendemyq/Claude_Loon_All.list/main/hgtv_adblock.js") with tag="黄果短剧_去广告与公告", timeout=15, requires_body=true

# 【第三层】前端路由补丁：秒过 5 秒开屏倒计时 + 前端层短路广告查询
response if ${url} ~= /^https?:\/\/[a-z0-9.-]+\/assets\/router-[A-Za-z0-9_-]+\.js/i then script("https://raw.githubusercontent.com/zhendemyq/Claude_Loon_All.list/main/hgtv_skip_splash.js") with tag="黄果短剧_秒过开屏", timeout=10, requires_body=true


[MITM]
# 末尾 4 个为 2026-11-07 实测 hgai_ops.txt 域名池轮换后的新网关域名
# ⚠️ 合并时：把你原有的 hostname 与下面合并成一行，去重，不要整行替换
hostname = *.hgtdwlyo.cc, *.xfyty.top, *.huigu.top, *.dlbmhx.top, *.lzmxmq.top, *.hgtv-vmmlyt.vip, *.fi8rnajon.top, *.hgapi-ykbxse.cc, *.laotaiqiu.top, *.huangguoai.com, *.huangguoai.cc, *.huangguoai.app, *.hgdjai.app, *.mhmtwvtu.cn, *.rmiytgvl.cn, *.sqyzcys20z.cc, *.bpvykh-mgapi.shop

# ============================================================
# 生效与自检（按顺序）
#   1. 保存描述文件 → Loon 里重新加载配置（彻底杀掉 Loon 再打开最稳）；
#   2. 只需普通网页浏览就能验证第一层是否生效：
#      Loon → 请求日志，搜索 ad/query，看该请求是否出现且被处理；
#   3. 若日志里没有 ad/query 请求 → 说明 MITM/MITM 域名没生效（检查第 4、5 步）；
#      若有请求但广告仍在 → 说明域名走了未覆盖的新网关（把日志里的域名发我）；
#   4. 设置 → 通用 → VPN与设备管理：确认 Loon CA 已安装；
#      设置 → 通用 → 关于本机 → 证书信任设置：Loon CA 完全信任已开启；
#   5. 删除 Safari 网站数据（SPA 会用 localStorage 缓存旧广告配置）；
#   6. 若广告消失但公告弹窗仍在 → 是第二层脚本没拉到，
#      国内网络下 raw.githubusercontent.com 可能不通，可改用 jsDelivr 镜像地址。
# ============================================================
